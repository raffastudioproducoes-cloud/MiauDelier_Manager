<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MiauDelier Manager</title>
    <script>
      // GitHub Pages não faz rewrite de servidor para SPA. Este redirect
      // reescreve a rota como query string e o script em index.html
      // desfaz isso via history.replaceState, restaurando a URL real.
      var pathSegmentsToKeep = 1 // /MiauDelier_Manager/
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>

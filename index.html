<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2F5D5A" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MiauDelier Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Desfaz o redirect de 404.html, restaurando a rota real antes do React montar.
      (function () {
        var l = window.location
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&q=')
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded[0].replace(/~and~/g, '&') +
              (decoded[1] ? '?' + decoded[1].replace(/~and~/g, '&') : '') +
              l.hash,
          )
        }
      })()
    </script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>

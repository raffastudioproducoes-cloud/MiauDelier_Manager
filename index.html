    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      #pwa-splash {
        align-items: center;
        background: #121416;
        box-sizing: border-box;
        color: #f6eee7;
        display: flex;
        flex-direction: column;
        inset: 0;
        justify-content: center;
        padding: 32px;
        position: fixed;
        text-align: center;
        transition: opacity 180ms ease-out;
        z-index: 9999;
      }
      #pwa-splash.is-ready { opacity: 0; pointer-events: none; }
      #pwa-splash img { height: 112px; margin-bottom: 20px; width: 112px; }
      #pwa-splash strong { font: 700 28px/1.1 system-ui, sans-serif; }
      #pwa-splash .product { color: #ffc48d; font: 800 12px/1.2 system-ui, sans-serif; letter-spacing: .11em; margin-top: 5px; }
      #pwa-splash .version { color: #bcb4ae; font: 500 12px/1.4 system-ui, sans-serif; margin: 18px 0 28px; }
      #pwa-splash footer { color: #bcb4ae; font: 500 11px/1.5 system-ui, sans-serif; }
      #pwa-splash .gitguard { border: 1px solid #4b433e; border-radius: 999px; color: #f6eee7; display: inline-block; font-size: 10px; margin-top: 8px; padding: 3px 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="pwa-splash" role="status" aria-label="Carregando MiauDelier Manager">
      <img src="%BASE_URL%pwa-192x192.png" alt="" />
      <strong>MiauDelier</strong>
      <span class="product">MANAGER</span>
      <span class="version">Versão %APP_VERSION%</span>
      <footer>
        Raffa Studio Produções<br />
        <span class="gitguard">Secured by GitGuard</span>
      </footer>
    </div>
    <script>
      // Desfaz o redirect de 404.html, restaurando a rota real antes do React montar.
      (function () {
        var l = window.location
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&q=')
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded[0].replace(/~and~/g, '&') +
              (decoded[1] ? '?' + decoded[1].replace(/~and~/g, '&') : '') +
              l.hash,
          )
        }
      })()
    </script>
  </body>
